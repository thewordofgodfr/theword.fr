<!doctype html>
<html lang="fr" class="dark theme-dark-blue" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />

    <!-- Indiquer aux moteurs de recherche qu'ils peuvent indexer -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="language" content="fr" />

    <!-- Force l'upgrade http -> https -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <title>The Word : application Bible 100% hors ligne et 100% gratuite en 18 langues</title>
    <meta name="description" content="The Word : application Bible 100% hors ligne en 18 langues. LSG 1910 révisée en 2025, recherche rapide, verset aléatoire, notes, mode malvoyant, sans inscription.">
    <link rel="canonical" href="https://www.theword.fr/"/>

    <!-- Metas pour l'UI système (valeur mise à jour par le script ci-dessous) -->
    <meta name="theme-color" content="#000000"/>
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />

    <!-- Favicons / PWA -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/logo192.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Open Graph -->
    <meta property="og:title" content="The Word : application Bible 100% hors ligne et 100% gratuite en 18 langues">
    <meta property="og:description" content="The Word : application Bible 100% hors ligne en 18 langues. LSG 1910 révisée en 2025, recherche rapide, verset aléatoire, notes, mode malvoyant, sans inscription.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.theword.fr/#about">
    <meta property="og:image" content="https://www.theword.fr/logo512.png">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:locale:alternate" content="en_US">


    <!-- PWA (optionnel) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- ===== Boot thème ultra-tôt (avant React & Tailwind) ===== -->
    <script>
      (function () {
        try {
          // L’application est toujours sombre, y compris avant le démarrage React.
          var root = document.documentElement;
          root.style.colorScheme = 'dark';
          root.style.setProperty('--force-body-bg', '#0f172a');
          var metaTC = document.querySelector('meta[name="theme-color"]');
          if (metaTC) metaTC.content = '#0f172a';
        } catch (e) {}
      })();
    </script>
    <!-- évite le flash de mauvais fond avant le CSS -->
    <style>
      html, body, #root { background-color: #0f172a; color-scheme: dark; }
      html, body, #root { min-height: 100vh; min-height: 100lvh; }
      body { margin: 0; }
    </style>
    <!-- ===== FIN boot thème ===== -->
  </head>

  <body>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
